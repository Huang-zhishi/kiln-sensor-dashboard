# /etc/nginx/conf.d/kiln-dashboard.conf
# 反向代理大屏应用；SSE（/api/stream）必须关闭缓冲，否则推送会被 nginx 攒包

upstream kiln_dashboard {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # gzip 压缩（HTML/JS/CSS/SSE 文本）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml image/svg+xml;

    # 静态资源：Next.js 构建产物带内容哈希，可长缓存
    location /_next/static/ {
        proxy_pass http://kiln_dashboard;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SSE 推送通道：关缓冲、不缓存、长超时
    location /api/stream {
        proxy_pass http://kiln_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        add_header X-Accel-Buffering no;
    }

    # 其余请求
    location / {
        proxy_pass http://kiln_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
