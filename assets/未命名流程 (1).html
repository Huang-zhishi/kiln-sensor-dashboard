  /* ============================================================
   * DataAdapter 接口定义
   *  MockDataAdapter / RestDataAdapter 均实现以下方法：
   *    getSensors(cid)             -> [{cid,key,label,unit,min,max}]
   *    getSensorLive(sensor)       -> { value, unit, ts }
   *    getHistory(sensor, rangeSec)-> [{ ts, value }]
   *  mode: 'mock' | 'rest'
   * ============================================================ */
  function normTag(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

  // —— 模拟数据适配器（当前默认）——
  function MockDataAdapter(doc){
    this.doc = doc;
    this.catalog = [];          // 全部传感器
    this.byCid = {};            // cid -> [sensor]
    this.buildCatalog();
    this.tick = 0;
    this._buildHistory();
  }
  MockDataAdapter.prototype.mode = 'mock';
  MockDataAdapter.prototype.buildCatalog = function(){
    const cat = [];
    doc.components.forEach(comp=>{
      if(comp.type==='text') return;
      const tag = comp.props && comp.props.tag;
      const name = comp.props && comp.props.name || '设备';
      const params = (comp.props && comp.props.params) || [];
      // 有绑定参数则用参数；有 tag 但无参数则生成 2 个通用传感器；都没有则跳过
      let set;
      if(params.length) set = params;
      else if(tag) set = [{k:'温度'},{k:'压力'}];
      else return;
      const list = [];
      set.forEach((p,i)=>{
        const key = `${name} ${p.k||'参数'} ${tag||comp.id}`;
        const meta = inferRange(p.k||'', p.u||'', parseFloat(p.v));
        list.push({ cid:comp.id, key, label:p.k||'参数', unit:meta.unit, min:meta.min, max:meta.max, base:meta.base });
      });
      list.forEach(s=>{ cat.push(s); });
      this.byCid[comp.id] = list;
    });
    this.catalog = cat;
  };
  MockDataAdapter.prototype.getSensors = function(cid){
    // 按 tag 模糊匹配：在目录中找 cid 对应的传感器（此处按构建索引精确关联，
    // 若未来接入真实接口，可改为对 key 做 normTag 子串匹配）
    return this.byCid[cid] || [];
  };
  function inferRange(k, u, v){
    const s = ((k||'')+' '+(u||'')).toUpperCase();
    let min=0,max=100,unit=u||'',base;
    if(s.indexOf('PH')>-1){ min=0;max=14;unit='pH'; }
    else if(s.indexOf('℃')>-1||s.indexOf('°C')>-1||s.indexOf('温度')>-1||s.indexOf('TEMP')>-1){ min=0;max=1000;unit=unit||'℃'; }
    else if(s.indexOf('KPA')>-1||s.indexOf('压力')>-1||s.indexOf('PRES')>-1){ min=0;max=100;unit=unit||'kPa'; }
    else if(s.indexOf('MM/S')>-1||s.indexOf('振动')>-1||s.indexOf('VIB')>-1){ min=0;max=12;unit=unit||'mm/s'; }
    else if(s.indexOf('流量')>-1||s.indexOf('FLOW')>-1){ min=0;max=500;unit=unit||'m³/h'; }
    else if(s.indexOf('%')>-1){ min=0;max=100;unit=unit||'%'; }
    base = (v!=null && !isNaN(v)) ? v : (min+max)/2;
    return { min, max, unit, base };
  }
  MockDataAdapter.prototype._buildHistory = function(){
    const now = Date.now();
    this.catalog.forEach(s=>{
      s.phase = Math.random()*Math.PI*2;
      s.amp = (s.max-s.min)*0.08;
      s.noise = (s.max-s.min)*0.01;
      s.cycle = 40 + Math.random()*80;
      s.drift = ((Math.random()*2-1)* (s.max-s.min)*0.02);
      s.hist = [];
      // 预填充历史（倒推 synthetic 数据）
      for(let i=DATA_CONFIG.historyCapacity;i>0;i--){
        const t = now - i*1000;
        const v = this._valueAt(s, -i);
        s.hist.push({ ts:t, value:v });
      }
    });
  };
  MockDataAdapter.prototype._valueAt = function(s, step){
    const w = 2*Math.PI/s.cycle;
    const t = (this.tick + step);
    const sin = s.base + s.amp*Math.sin(w*t + s.phase) + s.drift*step;
    const n = (Math.sin(t*1.3+ (s.phase||0)))*s.noise;
    return clamp(sin+n, s.min, s.max);
  };
  MockDataAdapter.prototype.update = function(){
    this.tick += 1;
    const now = Date.now();
    this.catalog.forEach(s=>{
      const v = clamp(this._valueAt(s,0), s.min, s.max);
      s.hist.push({ ts:now, value:v });
      if(s.hist.length > DATA_CONFIG.historyCapacity) s.hist.shift();
    });
  };
  MockDataAdapter.prototype.getSensorLive = function(s){
    const last = s.hist[s.hist.length-1];
    return { value: last?last.value:(s.base||0), unit:s.unit, ts: last?last.ts:Date.now() };
  };
  MockDataAdapter.prototype.getHistory = function(s, rangeSec){
    const n = Math.min(rangeSec, s.hist.length);
    return s.hist.slice(s.hist.length - n);
  };

  // —— 真实接口适配器（后端传感器 API）——
  function RestDataAdapter(doc){
    this.doc = doc;
    this.catalog = [];      // [{cid,key,label,unit,min,max,sensorTag,type}]
    this.byCid = {};        // cid -> [sensor]
    this.liveMap = {};      // sensorTag -> {value,unit,reported_at}
    this.ready = false;
  }
  RestDataAdapter.prototype.mode = 'rest';

  // 从后端拉取传感器目录并建立 组件→传感器 关联
  RestDataAdapter.prototype.init = async function(){
    try{
      const meta = {};
      const jl = await SENSOR_API.list();
      if(jl && Array.isArray(jl.data)) jl.data.forEach(d=>{ if(d && d.sensor_tag) meta[d.sensor_tag] = { type:d.type, kiln_id:d.kiln_id }; });
      const cat = [];
      doc.components.forEach(comp=>{
        if(comp.type==='text') return;
        const params = (comp.props && comp.props.params) || [];
        const set = params.length ? params : ((comp.props && comp.props.tag) ? [{ k:comp.props.tag }] : []);
        const list = [];
        set.forEach(p=>{
          const tag = p.k || '';
          if(!tag) return;
          const m = meta[tag] || {};
          list.push({ cid:comp.id, key:tag, label:p.k||tag, unit:p.u||'', min:0, max:100, sensorTag:tag, type:m.type||'' });
        });
        list.forEach(s=>cat.push(s));
        this.byCid[comp.id] = list;
      });
      this.catalog = cat;
      await this.refreshLive();
      this.ready = true;
    }catch(e){
      console.error('传感器目录加载失败', e);
      this.ready = false;
    }
  };

  // 拉取全部传感器实时值到缓存
  RestDataAdapter.prototype.refreshLive = async function(){
    try{
      const j = await SENSOR_API.values({ limit: 500 });
      if(j && Array.isArray(j.data)){
        const m = {};
        j.data.forEach(d=>{ if(d && d.sensor_tag) m[d.sensor_tag] = { value:d.value, unit:d.unit, reported_at:d.reported_at }; });
        this.liveMap = m;
      }
    }catch(e){ /* 网络失败静默 */ }
  };

  RestDataAdapter.prototype.update = function(){ this.refreshLive(); };

  RestDataAdapter.prototype.getSensors = function(cid){
    return this.byCid[cid] || [];
  };

  RestDataAdapter.prototype.getSensorLive = function(s){
    const live = this.liveMap[s.sensorTag];
    if(live){
      return { value: live.value, unit: live.unit || s.unit, ts: live.reported_at ? new Date(live.reported_at).getTime() : Date.now() };
    }
    return { value: null, unit: s.unit, ts: Date.now() };
  };

  // 后端无历史接口，用围绕实时值的合成曲线保证曲线可用
  RestDataAdapter.prototype.getHistory = function(s, rangeSec){
    const live = this.getSensorLive(s);
    const base = (live.value!=null && !isNaN(live.value)) ? live.value : 50;
    const n = Math.max(2, Math.min(rangeSec, 350));
    const now = Date.now();
    const arr = [];
    for(let i=n-1;i>=0;i--){
      const t = now - i*1000;
      const v = base + Math.sin((now/1000)*0.5 + i*0.3)*base*0.03 + (Math.random()-0.5)*base*0.01;
      arr.push({ ts:t, value:Math.max(0, v) });
    }
    return arr;
  };

  async function createDataAdapter(doc){
    // file:// 协议或无网络环境下无法跨域请求后端，直接使用 Mock
    if(location.protocol === 'file:' || !SENSOR_API_BASE){
      return new MockDataAdapter(doc);
    }
    try{
      const a = new RestDataAdapter(doc);
      await a.init();
      if(a.ready) return a;
    }catch(e){ console.warn('RestDataAdapter init failed, falling back to mock:', e); }
    return new MockDataAdapter(doc);
  }
  function updateSrcBadge(adapter){
    const live = adapter && adapter.mode === 'rest' && adapter.ready;
    el('srcText').textContent = live ? '实时数据' : '模拟数据';
    el('srcBadge').classList.toggle('live', !!live);
    el('stDot').classList.toggle('live', !!live);
  }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function fmt(v){
    if(v==null || isNaN(v)) return '—';
    return v.toFixed(v>=100?0:(v>=10?1:2));
  }

  // ============================================================
  // 文档加载
  // ============================================================
  // 嵌入模式：?embed=1 供第三方网站 iframe 嵌入，隐藏工具栏/状态栏
  const EMBED = true;
  var doc = { version:1, components:[], pipes:[], meta:{title:'未命名流程',bg:'#070612'} };
  var compMap = new Map();
  var pipeMap = new Map();
  function rebuildIndex(){
    compMap.clear(); pipeMap.clear();
    for(let i=0;i<doc.components.length;i++) compMap.set(doc.components[i].id, doc.components[i]);
    for(let i=0;i<doc.pipes.length;i++) pipeMap.set(doc.pipes[i].id, doc.pipes[i]);
  }
  function getComp(id){ return compMap.get(id); }
  function getPipe(id){ return pipeMap.get(id); }
  try{
    const qp = new URLSearchParams(location.search).get('doc');
    if(qp){                       // 优先使用 ?doc= 传入的项目（URI 编码 JSON）
      doc = JSON.parse(decodeURIComponent(qp));
    } else {
      const s = localStorage.getItem('pfd_doc');
      if(s) doc = JSON.parse(s);
    }
  }catch(e){ console.error('Failed to load doc:', e); }

  // 嵌入模式：隐藏界面 chrome，画布自适应容器
  if(EMBED){
    document.body.classList.add('embed');
  }

  el('docTitle').textContent = doc.meta.title || '未命名流程';
  document.title = (doc.meta.title || 'PFD') + ' · 预览';

  // 先用 MockDataAdapter 作为默认值（保证 adapter 始终非空），异步尝试连接后端后再切换
  let adapter = new MockDataAdapter(doc);

  // ============================================================
  // 视图状态
  // ============================================================
  let zoom = 1, panX = 0, panY = 0;
  let running = true;
  let flowRAF = null;
  let liveTimer = null;

  function applyView(){
    const vb = svg.viewBox.baseVal;
    const bw = 2000/zoom, bh = 1200/zoom;
    vb.x = panX; vb.y = panY; vb.width = bw; vb.height = bh;
    const pct = Math.round(zoom*100)+'%';
    el('zoomVal').textContent = pct;
    el('stZoom').textContent = pct;
  }
  function zoomBy(f){
    zoom = Math.max(0.2, Math.min(4, zoom*f));
    applyView();
  }
  function zoomFit(){
    if(!doc.components.length){ zoom=1; panX=0; panY=0; applyView(); return; }
    let minX=1e9, minY=1e9, maxX=-1e9, maxY=-1e9;
    doc.components.forEach(c=>{
      minX=Math.min(minX,c.x); minY=Math.min(minY,c.y);
      maxX=Math.max(maxX,c.x+c.w); maxY=Math.max(maxY,c.y+c.h);
    });
    doc.pipes.forEach(p=>{
      (p._pts||[]).forEach(pt=>{
        minX=Math.min(minX,pt.x); minY=Math.min(minY,pt.y);
        maxX=Math.max(maxX,pt.x); maxY=Math.max(maxY,pt.y);
      });
    });
    const pad=80;
    minX-=pad; minY-=pad;
    const w=maxX-minX+pad*2, h=maxY-minY+pad*2;
    const rect = svg.getBoundingClientRect();
    zoom = Math.min(rect.width/w, rect.height/h) * 0.95;
    panX = minX; panY = minY;
    applyView();
  }

  function portPosComp(comp, portId){
    const t = TEMPLATES[comp.type]; if(!t) return null;
    const pt = t.ports.find(p=>p.id===portId); if(!pt) return null;
    const rot = (comp.rotation||0) * Math.PI/180;
    const mirrored = comp.props && comp.props.mirrored;
    const px = (mirrored ? (1-pt.x) : pt.x) * comp.w;
    const py = pt.y * comp.h;
    const cx = comp.w/2, cy = comp.h/2;
    const cos = Math.cos(rot), sin = Math.sin(rot);
    const rx = cx + (px-cx)*cos - (py-cy)*sin;
    const ry = cy + (px-cx)*sin + (py-cy)*cos;
    const dirMap = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
    let dir = pt.dir;
    if(mirrored && (dir==='left'||dir==='right')) dir = dir==='left'?'right':'left';
    const d = dirMap[dir] || {x:0,y:0};
    const drx = d.x*cos - d.y*sin;
    const dry = d.x*sin + d.y*cos;
    const finalDir = Math.abs(drx)>Math.abs(dry) ? (drx>0?'right':'left') : (dry>0?'down':'up');
    return { x: comp.x+rx, y: comp.y+ry, dir: finalDir };
  }

  function simpleRoute(p1, dir1, p2, dir2){
    const pts = [{x:p1.x,y:p1.y}];
    if(dir1==='right' && dir2==='left'){ const mx=(p1.x+p2.x)/2; pts.push({x:mx,y:p1.y},{x:mx,y:p2.y},{x:p2.x,y:p2.y}); }
    else if(dir1==='down' && dir2==='up'){ const my=(p1.y+p2.y)/2; pts.push({x:p1.x,y:my},{x:p2.x,y:my},{x:p2.x,y:p2.y}); }
    else if((dir1==='right'&&dir2==='up')||(dir1==='right'&&dir2==='down')||(dir1==='left'&&dir2==='up')||(dir1==='down'&&dir2==='right')||(dir1==='down'&&dir2==='left')){ pts.push({x:p2.x,y:p1.y},{x:p2.x,y:p2.y}); }
    else if(dir1==='up' && dir2==='down'){ const my=(p1.y+p2.y)/2; pts.push({x:p1.x,y:my},{x:p2.x,y:my},{x:p2.x,y:p2.y}); }
    else if(dir1==='left' && dir2==='right'){ const mx=(p1.x+p2.x)/2; pts.push({x:mx,y:p1.y},{x:mx,y:p2.y},{x:p2.x,y:p2.y}); }
    else { pts.push({x:p2.x,y:p2.y}); }
    return pts;
  }
  function ptsToD(pts){
    if(!pts || pts.length<2) return '';
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for(let i=1;i<pts.length;i++) d += ` L ${pts[i].x} ${pts[i].y}`;
    return d;
  }
  function pointAlongPath(pts, t){
    let segs=[], total=0;
    for(let i=1;i<pts.length;i++){
      const d=Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
      segs.push(d); total+=d;
    }
    let dist=t*total, acc=0;
    for(let i=1;i<pts.length;i++){
      if(acc+segs[i-1]>=dist){
        const r = segs[i-1]===0?0:(dist-acc)/segs[i-1];
        return { x: pts[i-1].x+(pts[i].x-pts[i-1].x)*r, y: pts[i-1].y+(pts[i].y-pts[i-1].y)*r };
      }
      acc+=segs[i-1];
    }
    return pts[pts.length-1];
  }

  // ============================================================
  // 渲染
  // ============================================================
  function render(){
    rebuildIndex();
    layerPipes.innerHTML = '';
    layerEquip.innerHTML = '';
    layerFlow.innerHTML = '';

    // Pipes
    doc.pipes.forEach(pipe=>{
      const g = mk('g');
      let pts;
      if(pipe.from && pipe.to){
        const c1 = getComp(pipe.from.cid);
        const c2 = getComp(pipe.to.cid);
        if(!c1||!c2) return;
        const p1 = portPosComp(c1, pipe.from.port);
        const p2 = portPosComp(c2, pipe.to.port);
        if(!p1||!p2) return;
        pts = (typeof routePipe==='function') ? routePipe(p1,p1.dir,p2,p2.dir,pipe.bend,pipe.straight) : simpleRoute(p1,p1.dir,p2,p2.dir);
        pipe._pts = pts;
      } else {
        pts = pipe.points || [];
        pipe._pts = pts;
      }
      if(!pts || pts.length<2) return;
      const pt = PIPE_TYPES[pipe.type] || PIPE_TYPES.solid;
      const path = mk('path');
      path.setAttribute('d', ptsToD(pts));
      path.setAttribute('class','pipe');
      path.setAttribute('stroke', pt.color);
      path.setAttribute('stroke-width', pipe.width || 2.5);
      path.setAttribute('stroke-dasharray', pt.dash==='none' ? '' : pt.dash);
      g.appendChild(path);
      if(pipe.label){
        const mid = pointAlongPath(pts, pipe.labelPos==null ? 0.5 : pipe.labelPos);
        const tw = pipe.label.length*7+8;
        const bg = mk('rect');
        bg.setAttribute('x', mid.x-tw/2); bg.setAttribute('y', mid.y-9);
        bg.setAttribute('width', tw); bg.setAttribute('height', 16); bg.setAttribute('rx',3);
        bg.setAttribute('fill','#12112Bee'); bg.setAttribute('stroke', pt.color); bg.setAttribute('stroke-width',0.8);
        g.appendChild(bg);
        const tx = mk('text');
        tx.setAttribute('x', mid.x); tx.setAttribute('y', mid.y+3);
        tx.setAttribute('text-anchor','middle'); tx.setAttribute('font-size','10'); tx.setAttribute('fill', pt.color);
        tx.setAttribute('font-family','inherit'); tx.textContent = pipe.label;
        g.appendChild(tx);
      }
      layerPipes.appendChild(g);
    });

    // Equipment (interactive)
    doc.components.forEach(comp=>{
      const t = TEMPLATES[comp.type]; if(!t) return;
      const g = mk('g');
      g.setAttribute('transform', `translate(${comp.x},${comp.y}) rotate(${comp.rotation||0} ${comp.w/2} ${comp.h/2})`);
      const clipId = 'clip-' + comp.id;
      const defs = mk('defs');
      const clip = mk('clipPath');
      clip.setAttribute('id', clipId);
      const clipRect = mk('rect');
      clipRect.setAttribute('x', -2); clipRect.setAttribute('y', -2);
      clipRect.setAttribute('width', comp.w+4); clipRect.setAttribute('height', comp.h+4);
      clipRect.setAttribute('rx', 4);
      clip.appendChild(clipRect);
      defs.appendChild(clip);
      g.appendChild(defs);
      const bodyWrap = mk('g');
      bodyWrap.setAttribute('clip-path', `url(#${clipId})`);
      const mirrored = comp.props && comp.props.mirrored;
      if(mirrored){
        const mirrorG = mk('g');
        mirrorG.setAttribute('transform', `translate(${comp.w},0) scale(-1,1)`);
        mirrorG.innerHTML = t.render(comp.w, comp.h, comp.props);
        bodyWrap.appendChild(mirrorG);
      } else {
        bodyWrap.innerHTML = t.render(comp.w, comp.h, comp.props);
      }
      Array.from(bodyWrap.children).forEach(c=>g.appendChild(c));
      layerEquip.appendChild(g);

      // 标签（在旋转组外）
      const cx = comp.x + comp.w/2, cy = comp.y + comp.h/2;
      const r = (comp.rotation||0) * Math.PI/180;
      const cos = Math.cos(r), sin = Math.sin(r);
      if(comp.type!=='text'){
        const lbl = mk('text');
        const ldx=0, ldy=-(comp.h/2+6);
        lbl.setAttribute('x', cx+ldx*cos-ldy*sin);
        lbl.setAttribute('y', cy+ldx*sin+ldy*cos);
        lbl.setAttribute('text-anchor','middle'); lbl.setAttribute('class','tlabel');
        lbl.textContent = comp.props.name || t.name;
        layerEquip.appendChild(lbl);
      }
      if(comp.props.tag){
        const tg = mk('text');
        const tdx=0, tdy=(comp.h/2+14);
        tg.setAttribute('x', cx+tdx*cos-tdy*sin);
        tg.setAttribute('y', cy+tdx*sin+tdy*cos);
        tg.setAttribute('text-anchor','middle'); tg.setAttribute('class','ttag');
        tg.textContent = comp.props.tag;
        layerEquip.appendChild(tg);
      }
      // params 值不渲染在画布上，悬浮面板(dpSensors/hpRows)已展示实时数据

      // 交互：透明命中框 + 事件
      if(comp.type!=='text'){
        const hit = mk('rect');
        hit.setAttribute('x',0); hit.setAttribute('y',0);
        hit.setAttribute('width',comp.w); hit.setAttribute('height',comp.h);
        hit.setAttribute('fill','rgba(156,153,255,0)');
        hit.setAttribute('class','equip-hoverbox');
        g.appendChild(hit);
        g.classList.add('equip-group');
        g.dataset.cid = comp.id;
        g.addEventListener('mouseenter', ev=>showHover(comp, ev));
        g.addEventListener('mousemove', ev=>moveHover(ev));
        g.addEventListener('mouseleave', ()=>hideHover());
        g.addEventListener('click', ev=>{ ev.stopPropagation(); selectComponent(comp); });
      }
    });
  }

  // ============================================================
  // 实时刷新（模拟数据每秒推进 + 面板刷新）
  // ============================================================
  function startLive(){
    if(liveTimer) return;
    liveTimer = setInterval(()=>{
      if(adapter.update) adapter.update();
      refreshHover();
      refreshDetail();
    }, DATA_CONFIG.refreshMs);
  }
  function stopLive(){ if(liveTimer){ clearInterval(liveTimer); liveTimer=null; } }

  // （重新）初始化数据适配器：停止旧定时器 → 创建新 adapter → 启动实时刷新
  async function initAdapter(){
    stopLive();
    try{
      adapter = await createDataAdapter(doc);
    }catch(e){
      console.error('createDataAdapter error:', e);
      adapter = new MockDataAdapter(doc);
    }
    updateSrcBadge(adapter);
    startLive();
    // 刷新当前悬浮面板/详情面板
    refreshHover();
    refreshDetail();
  }

  // ============================================================
  // 悬停面板
  // ============================================================
  const hoverPanel = el('hoverPanel');
  let hoverCid = null;
  function showHover(comp, ev){
    hoverCid = comp.id;
    el('hpName').textContent = comp.props.name || TEMPLATES[comp.type].name;
    el('hpTag').textContent = comp.props.tag || '—';
    hoverPanel.classList.add('show');
    renderHoverRows(comp);
    moveHover(ev);
  }
  function renderHoverRows(comp){
    const sensors = adapter.getSensors(comp.id);
    const box = el('hpRows');
    if(!sensors.length){
      box.innerHTML = '<div class="hp-empty">无关联传感器（未设置 tag）</div>';
      el('hpTime').textContent = '';
      return;
    }
    let html = '';
    sensors.forEach(s=>{
      const live = adapter.getSensorLive(s);
      html += `<div class="hp-row"><span class="k">${esc(s.label)}</span><span><span class="v">${fmt(live.value)}</span><span class="u">${esc(s.unit)}</span></span></div>`;
    });
    box.innerHTML = html;
    const t = hoverTime();
    el('hpTime').textContent = t ? '更新于 ' + t : '';
  }
  function refreshHover(){
    if(!hoverCid) return;
    const comp = getComp(hoverCid);
    if(comp) renderHoverRows(comp);
  }
  function moveHover(ev){
    if(!hoverPanel.classList.contains('show')) return;
    const pad = 14;
    const x = ev.clientX + pad, y = ev.clientY + pad;
    const rect = hoverPanel.getBoundingClientRect();
    const nx = (x + rect.width > window.innerWidth) ? ev.clientX - rect.width - pad : x;
    const ny = (y + rect.height > window.innerHeight) ? ev.clientY - rect.height - pad : y;
    hoverPanel.style.left = Math.max(6, nx) + 'px';
    hoverPanel.style.top  = Math.max(6, ny) + 'px';
  }
  function hideHover(){ hoverCid=null; hoverPanel.classList.remove('show'); }
  function hoverTime(){
    const sensors = adapter.getSensors(hoverCid||'');
    if(!sensors.length) return '';
    const live = adapter.getSensorLive(sensors[0]);
    if(!live || !live.ts) return '';
    return new Date(live.ts).toLocaleTimeString();
  }

  // ============================================================
  // 详情面板（点击选中 + 历史曲线）
  // ============================================================
  const detailPanel = el('detailPanel');
  let selectedCid = null;
  let selectedSensor = null;
  let rangeSec = 60;

  function selectComponent(comp){
    selectedCid = comp.id;
    // 高亮
    document.querySelectorAll('.equip-group.selected').forEach(e=>e.classList.remove('selected'));
    const g = layerEquip.querySelector(`[data-cid="${comp.id}"]`);
    if(g) g.classList.add('selected');

    el('dpName').textContent = comp.props.name || TEMPLATES[comp.type].name;
    el('dpTag').textContent = comp.props.tag || '—';
    const sensors = adapter.getSensors(comp.id);
    el('dpNote').textContent = '数据源：后端实时接口（未设置 tag 的设备无关联传感器）';

    // 传感器列表
    const box = el('dpSensors');
    if(!sensors.length){
      box.innerHTML = '<div class="dp-empty">无关联传感器<br>（请为组件设置 tag）</div>';
      selectedSensor = null;
    } else {
      let html = '';
      sensors.forEach(s=>{
        const live = adapter.getSensorLive(s);
        html += `<div class="dp-sensor" data-key="${esc(s.key)}">
          <span class="sdot"></span><span class="sname">${esc(s.label)}</span>
          <span class="sval">${fmt(live.value)}</span><span class="sun">${esc(s.unit)}</span>
        </div>`;
      });
      box.innerHTML = html;
      selectedSensor = sensors[0];
      box.querySelectorAll('.dp-sensor').forEach((row,i)=>{
        if(i===0) row.classList.add('active');
        row.addEventListener('click', ()=>{
          selectedSensor = sensors[i];
          box.querySelectorAll('.dp-sensor').forEach(r=>r.classList.remove('active'));
          row.classList.add('active');
          drawChart();
        });
      });
    }
    detailPanel.classList.add('open');
    drawChart();
  }

  function closeDetail(){
    detailPanel.classList.remove('open');
    selectedCid = null; selectedSensor = null;
    document.querySelectorAll('.equip-group.selected').forEach(e=>e.classList.remove('selected'));
  }

  function refreshDetail(){
    if(!detailPanel.classList.contains('open') || !selectedCid) return;
    const comp = getComp(selectedCid);
    if(!comp) return;
    // 刷新传感器列表数值
    const sensors = adapter.getSensors(comp.id);
    if(!sensors.length){ return; }
    const rows = el('dpSensors').querySelectorAll('.dp-sensor');
    rows.forEach((row,i)=>{
      if(sensors[i]){
        const live = adapter.getSensorLive(sensors[i]);
        row.querySelector('.sval').textContent = fmt(live.value);
      }
    });
    // 刷新图表当前值
    if(selectedSensor){
      const live = adapter.getSensorLive(selectedSensor);
      el('chartCur').textContent = fmt(live.value) + ' ' + selectedSensor.unit;
    }
    drawChart();
  }

  // 历史曲线（Canvas 绘制，无第三方依赖）
  function drawChart(){
    const canvas = el('chart');
    if(!selectedSensor){ el('chartSensorName').textContent='—'; el('chartCur').textContent='—'; clearChart(); return; }
    el('chartSensorName').textContent = selectedSensor.key || selectedSensor.label;
    const live = adapter.getSensorLive(selectedSensor);
    el('chartCur').textContent = fmt(live.value) + ' ' + live.unit;

    const series = adapter.getHistory(selectedSensor, rangeSec);
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);

    const pad = { l:38, r:8, t:8, b:20 };
    const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    if(!series || series.length<2){
      ctx.fillStyle='#FFFFFF66'; ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText('暂无历史数据', W/2, H/2);
      return;
    }
    // 值域
    let vmin=Infinity, vmax=-Infinity;
    series.forEach(p=>{ if(p.value<vmin)vmin=p.value; if(p.value>vmax)vmax=p.value; });
    const span = (vmax-vmin) || 1;
    vmin -= span*0.1; vmax += span*0.1;

    // 网格 + 纵轴
    ctx.strokeStyle='#9C99FF22'; ctx.fillStyle='#FFFFFF88'; ctx.font='9px sans-serif'; ctx.textAlign='right';
    for(let i=0;i<=4;i++){
      const y = pad.t + ch*i/4;
      const val = vmax - (vmax-vmin)*i/4;
      ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
      ctx.fillText(val.toFixed(val>=100?0:1), pad.l-4, y+3);
    }
    // 时间轴
    const t0 = series[0].ts, t1 = series[series.length-1].ts;
    ctx.textAlign='center';
    ctx.fillText(ts(t0), pad.l, H-6);
    ctx.fillText(ts(t1), W-pad.r, H-6);

    // 面积渐变
    const grad = ctx.createLinearGradient(0,pad.t,0,H-pad.b);
    grad.addColorStop(0, '#00E5FF55'); grad.addColorStop(1, '#00E5FF00');
    ctx.beginPath();
    series.forEach((p,i)=>{
      const x = pad.l + (i/(series.length-1))*cw;
      const y = pad.t + (1-(p.value-vmin)/(vmax-vmin))*ch;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.lineTo(pad.l+cw, H-pad.b); ctx.lineTo(pad.l, H-pad.b); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();

    // 折线
    ctx.beginPath();
    series.forEach((p,i)=>{
      const x = pad.l + (i/(series.length-1))*cw;
      const y = pad.t + (1-(p.value-vmin)/(vmax-vmin))*ch;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.strokeStyle='#00E5FF'; ctx.lineWidth=1.6; ctx.lineJoin='round'; ctx.stroke();

    // 当前值点
    const last = series[series.length-1];
    const lx = pad.l+cw, ly = pad.t + (1-(last.value-vmin)/(vmax-vmin))*ch;
    ctx.beginPath(); ctx.arc(lx,ly,3,0,Math.PI*2); ctx.fillStyle='#00E5FF'; ctx.fill();
    ctx.beginPath(); ctx.arc(lx,ly,6,0,Math.PI*2); ctx.strokeStyle='#00E5FF66'; ctx.lineWidth=1; ctx.stroke();
  }
  function clearChart(){
    const canvas = el('chart');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  function ts(t){ const d=new Date(t); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; }

  // ============================================================
  // 流动动画
  // ============================================================
  let flowNodes = [];   // 粒子节点池：复用于每次动画帧，避免每帧销毁/重建
  const FLOW_TRAIL = 4; // 每个主粒子随影拖尾数（拖尾越长越流畅，节点数 = 粒子数*(1+FLOW_TRAIL)）
  function startFlow(){
    if(flowRAF) return;
    function ensureNodes(n){
      // 若上次池中的节点已被重渲染清出 DOM（未连接），整体重建池
      if(flowNodes.length && !flowNodes[0].isConnected){ flowNodes = []; layerFlow.innerHTML=''; }
      while(flowNodes.length < n){
        const c = mk('circle');
        c.setAttribute('class','flow-dot');
        layerFlow.appendChild(c);
        flowNodes.push(c);
      }
      while(flowNodes.length > n){
        const extra = flowNodes.pop();
        extra.remove();
      }
    }
    function tick(){
      // 计算当前需要的粒子总数（含拖尾）
      const n = FLOW_TRAIL + 1;
      let need = 0;
      doc.pipes.forEach(pipe=>{ if(pipe._pts && pipe._pts.length>=2) need += 3*n; });
      doc.components.forEach(comp=>{ if(comp.type==='silo') need += 8*n; });
      ensureNodes(need);
      let idx = 0;
      // 管道粒子（含拖尾：沿路径滞后、渐隐渐小）
      doc.pipes.forEach(pipe=>{
        if(!pipe._pts || pipe._pts.length<2) return;
        const pt = PIPE_TYPES[pipe.type] || PIPE_TYPES.solid;
        const t = (performance.now()/1000 * (pt.speed||0.3)) % 1;
        for(let k=0;k<3;k++){
          const base = (t+k/3)%1;
          for(let j=0;j<n;j++){
            const u = ((base - j*0.018) % 1 + 1) % 1;
            const p = pointAlongPath(pipe._pts, u);
            const fade = 1 - j/n;
            const c = flowNodes[idx++];
            c.setAttribute('cx',p.x); c.setAttribute('cy',p.y);
            c.setAttribute('r', 2.6 * (0.35 + 0.65*fade));
            c.setAttribute('fill',pt.color);
            c.setAttribute('opacity', 0.12 + 0.88*fade);
          }
        }
      });
      // 料仓落料粒子（含拖尾）
      const now = performance.now()/1000;
      doc.components.forEach(comp=>{
        if(comp.type!=='silo') return;
        const w=comp.w, h=comp.h;
        const cx=comp.x+w/2, topY=comp.y+5, bottomY=comp.y+h*0.92;
        const pColor=comp.props.color||'#9C99FF';
        const seed=comp.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
        for(let i=0;i<8;i++){
          const base = (now*0.6 + ((seed*0.137+i*0.618)%1)) % 1;
          for(let j=0;j<n;j++){
            const tt = base - j*0.03;
            const t = ((tt%1)+1)%1;
            const y = topY+(bottomY-topY)*t;
            const sway = Math.sin(now*1.5+i*2.1+seed-j*0.5)*w*0.15;
            const fade = 1 - j/n;
            const c=flowNodes[idx++];
            c.setAttribute('cx',cx+sway); c.setAttribute('cy',y);
            c.setAttribute('r',(1.5+0.8*(1-t))*(0.35+0.65*fade));
            c.setAttribute('fill',pColor);
            c.setAttribute('opacity',(0.3+0.7*(1-t))*fade);
          }
        }
      });
      flowRAF = requestAnimationFrame(tick);
    }
    tick();
  }
  function stopFlow(){ if(flowRAF){ cancelAnimationFrame(flowRAF); flowRAF=null; } layerFlow.innerHTML=''; flowNodes.length=0; }

  // ============================================================
  // 画布平移/缩放
  // ============================================================
  let panning = false, panStart = null;
  svg.addEventListener('mousedown', e=>{
    if(e.button===0){
      panning = true; svg.classList.add('panning');
      panStart = { sx:e.clientX, sy:e.clientY, px:panX, py:panY };
    }
  });
  window.addEventListener('mousemove', e=>{
    if(!panning) return;
    const rect = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    const scaleX = vb.width/rect.width, scaleY = vb.height/rect.height;
    panX = panStart.px - (e.clientX-panStart.sx)*scaleX;
    panY = panStart.py - (e.clientY-panStart.sy)*scaleY;
    applyView();
  });
  window.addEventListener('mouseup', ()=>{ panning=false; svg.classList.remove('panning'); });
  svg.addEventListener('wheel', e=>{
    e.preventDefault();
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX-rect.left, my = e.clientY-rect.top;
    const vb = svg.viewBox.baseVal;
    const wx = vb.x + mx*vb.width/rect.width, wy = vb.y + my*vb.height/rect.height;
    const f = e.deltaY<0 ? 1.12 : 0.89;
    const newZoom = Math.max(0.2, Math.min(4, zoom*f));
    const ratio = newZoom/zoom;
    panX = wx - (wx-vb.x)/ratio;
    panY = wy - (wy-vb.y)/ratio;
    zoom = newZoom;
    applyView();
  }, {passive:false});

  function screenToSVG(cx, cy){
    const rect = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    return { x: vb.x + (cx-rect.left)*vb.width/rect.width, y: vb.y + (cy-rect.top)*vb.height/rect.height };
  }

  // ============================================================
  // 工具栏 / 键盘
  // ============================================================
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  el('btnZoomIn').onclick = ()=>zoomBy(1.2);
  el('btnZoomOut').onclick = ()=>zoomBy(0.8);
  el('btnZoomFit').onclick = zoomFit;
  el('btnRun').onclick = ()=>{ running=!running; el('btnRun').classList.toggle('active',running); if(running) startFlow(); else stopFlow(); };
  el('dpClose').onclick = closeDetail;
  // 时间范围按钮
  el('rangeBar').querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      rangeSec = parseInt(btn.dataset.r,10);
      el('rangeBar').querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      drawChart();
    });
  });
  window.addEventListener('keydown', e=>{
    if(e.key==='+'||e.key==='=') zoomBy(1.2);
    else if(e.key==='-') zoomBy(0.8);
    else if(e.key==='0'){ zoomFit(); e.preventDefault(); }
    else if(e.key===' '){ running=!running; el('btnRun').classList.toggle('active',running); if(running) startFlow(); else stopFlow(); e.preventDefault(); }
    else if(e.key==='Escape'){ closeDetail(); hideHover(); }
  });

  // ============================================================
  // 嵌入模式：对外 API + 与宿主页面通讯
  // ============================================================
  if(EMBED){
    const notify = (type, extra={}) => {
      if(window.parent && window.parent!==window) window.parent.postMessage({source:'pfd-embed', type, ...extra}, '*');
    };
    // 宿主可在 iframe onload 后调用 window.PFDEmbed
    window.PFDEmbed = {
      load(d){ try{
        doc = JSON.parse(typeof d==='string' ? d : JSON.stringify(d));
        render(); zoomFit();
        // 关键：用新 doc 重建数据适配器，否则传感器目录为空导致悬浮面板无数据
        initAdapter();
        const t = (doc.meta&&doc.meta.title)||'PFD';
        el('docTitle').textContent = t;
        document.title = t + ' · 预览';
        notify('ready',{title:t});
      }catch(e){ console.error('PFDEmbed.load error', e); } },
      fit(){ zoomFit(); },
      setRunning(on){ running=!!on; el('btnRun').classList.toggle('active',running); if(running) startFlow(); else stopFlow(); },
      getRunning(){ return running; },
      getTitle(){ return (doc.meta&&doc.meta.title)||'PFD'; }
    };
    // 选中设备时通知宿主
    const _sel = selectComponent;
    selectComponent = function(comp){
      _sel(comp);
      notify('select', { id: comp.id, name: (comp.props&&comp.props.name)||'' });
    };
    // 接收宿主指令
    window.addEventListener('message', e=>{
      const m = e.data; if(!m || m.source!=='pfd-host') return;
      if(m.type==='load') window.PFDEmbed.load(m.doc);
      else if(m.type==='fit') window.PFDEmbed.fit();
      else if(m.type==='run') window.PFDEmbed.setRunning(!!m.value);
    });
    // 容器尺寸变化时自适应
    const ro = new ResizeObserver(()=>{ zoomFit(); });
    ro.observe(document.body);
  }

  // ============================================================
  // 初始化（先立即渲染画面 + Mock 数据保证可用，再异步尝试连接实时后端）
  // ============================================================
  render();
  setTimeout(()=>{ zoomFit(); if(running) startFlow(); }, 100);
  updateSrcBadge(adapter);
  startLive();
  // 异步尝试连接真实后端（如果是 HTTP 环境且后端可达，会自动从 Mock 切换为 Rest）
  if(location.protocol !== 'file:' && SENSOR_API_BASE){
    createDataAdapter(doc).then(a=>{
      stopLive();
      adapter = a;
      updateSrcBadge(adapter);
      startLive();
      refreshHover();
      refreshDetail();
    }).catch(e=>{
      console.warn('实时后端不可用，继续使用模拟数据:', e);
    });
  }
  window.addEventListener('resize', ()=>{ applyView(); if(detailPanel.classList.contains('open')) drawChart(); });
